[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[project]
name = "cloudflare-flagship"
version = "0.3.1"
description = "OpenFeature provider for Cloudflare Flagship feature flags."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1", "openfeature-sdk>=0.9.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cloudflare/flagship"
Repository = "https://github.com/cloudflare/flagship"
Changelog = "https://github.com/cloudflare/flagship/blob/main/sdks/typescript/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]

[tool.uv.build-backend]
module-name = "flagship"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = "src"
python_version = "3.10"
strict = true
disallow_any_generics = false
pretty = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

