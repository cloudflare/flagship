name: Release

# On push to main:
#   - If there are pending changesets, opens/updates a release PR that bumps
#     versions and rewrites changelogs.
#   - If the previous commit was a merge of that release PR (no pending
#     changesets remain), publishes only the SDKs changed since their previous
#     successful publication.
#
# PR CI (`pull-request.yml`) is the source of truth for correctness; this
# workflow does not re-run checks. Branch protection on `main` requires
# `CI Success` to pass before merge.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Changesets
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
      python_changed: ${{ steps.sdk-changes.outputs.python }}
      go_changed: ${{ steps.sdk-changes.outputs.go }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: '11'

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      # `uv` is needed by `.github/changeset-version.ts` to refresh `uv.lock`
      # when the Python SDK version is bumped.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          working-directory: sdks/python

      - run: pnpm install --frozen-lockfile

      - name: Detect changed SDKs
        id: sdk-changes
        run: pnpm tsx .github/release-sdks.ts detect

      - run: pnpm run build

      - id: changesets
        uses: changesets/action@v1.9.0
        with:
          version: pnpm tsx .github/changeset-version.ts
          publish: pnpm tsx .github/release-sdks.ts publish
          title: 'chore(release): version SDK packages'
          # `.github/release-sdks.ts` matches this message to skip mechanical version
          # bumps when detecting SDK changes. Keep both in sync.
          commit: 'chore(release): version SDK packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          TYPESCRIPT_SDK_CHANGED: ${{ steps.sdk-changes.outputs.typescript }}
          PYTHON_SDK_CHANGED: ${{ steps.sdk-changes.outputs.python }}
          GO_SDK_CHANGED: ${{ steps.sdk-changes.outputs.go }}

  tag-go:
    name: Tag Go SDK
    needs: release
    if: ${{ needs.release.outputs.has_changesets == 'false' && needs.release.outputs.go_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag Go SDK for pkg.go.dev
        run: |
          VERSION=$(node -p "require('./sdks/go/package.json').version")
          TAG="sdks/go/v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}" || {
              echo "${TAG} exists on a different commit." >&2
              exit 1
            }
            echo "${TAG} already exists on this release; skipping."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

  publish-pypi:
    name: Publish PyPI
    needs: release
    if: ${{ needs.release.outputs.has_changesets == 'false' && needs.release.outputs.python_changed == 'true' }}
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      contents: write
      id-token: write
