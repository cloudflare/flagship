name: Publish PyPI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/cloudflare-flagship/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: sdks/python

      - name: Build
        working-directory: sdks/python
        run: uv build

      - name: Publish
        working-directory: sdks/python
        run: uv publish
