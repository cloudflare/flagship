name: Release

# On push to main:
#   - If there are pending changesets, opens/updates a release PR that bumps
#     versions and rewrites changelogs.
#   - If this commit merged that release PR, publishes only the SDKs changed
#     since their previous successful publication.
#
# Change detection reports nothing unless the pushed commit merged the release
# PR, so ordinary pushes to `main` — which also have an empty changeset queue —
# cannot publish an unbumped version. Re-running a failed release run repeats
# the same commit, so partial publishes stay retryable.
#
# PR CI (`pull-request.yml`) is the source of truth for correctness; this
# workflow does not re-run checks. Branch protection on `main` requires
# `CI Success` to pass before merge.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Changesets
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      has_changesets: ${{ steps.changesets.outputs.has-changesets }}
      python_changed: ${{ steps.sdk-changes.outputs.python }}
      go_changed: ${{ steps.sdk-changes.outputs.go }}
      rust_changed: ${{ steps.sdk-changes.outputs.rust }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # `uv` is needed by `.github/changeset-version.ts` to refresh `uv.lock`
      # when the Python SDK version is bumped.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sdks/python

      - run: pnpm install --frozen-lockfile

      - name: Detect changed SDKs
        id: sdk-changes
        run: pnpm tsx .github/release-sdks.ts detect

      - run: pnpm run build

      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm tsx .github/changeset-version.ts
          publish-script: pnpm tsx .github/release-sdks.ts publish
          pr-title: 'chore(release): version SDK packages'
          # `.github/release-sdks.ts` matches this message to recognise release
          # commits and skip their mechanical version bumps. Keep both in sync.
          commit-message: 'chore(release): version SDK packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # v2 pushes through the GitHub API by default. Keep the Git CLI so release
          # commits and tags are pushed the same way as under v1.
          push-with-git-cli: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          TYPESCRIPT_SDK_CHANGED: ${{ steps.sdk-changes.outputs.typescript }}
          PYTHON_SDK_CHANGED: ${{ steps.sdk-changes.outputs.python }}
          GO_SDK_CHANGED: ${{ steps.sdk-changes.outputs.go }}
          RUST_SDK_CHANGED: ${{ steps.sdk-changes.outputs.rust }}

      # changesets/action v2 only warns when a tag push fails. Release detection
      # needs this tag as its baseline, so fail the job if it was not pushed.
      - name: Verify canonical release tag
        if: ${{ steps.changesets.outputs.has-changesets == 'false' && (steps.sdk-changes.outputs.typescript == 'true' || steps.sdk-changes.outputs.python == 'true' || steps.sdk-changes.outputs.go == 'true' || steps.sdk-changes.outputs.rust == 'true') }}
        run: |
          VERSION=$(node -p "require('./sdks/typescript/package.json').version")
          TAG="@cloudflare/flagship@${VERSION}"
          REMOTE_COMMIT=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)
          if [ "${REMOTE_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "${TAG} must point to ${GITHUB_SHA} on origin (found ${REMOTE_COMMIT:-no tag})." >&2
            exit 1
          fi

  tag-go:
    name: Tag Go SDK
    needs: release
    if: ${{ needs.release.outputs.has_changesets == 'false' && needs.release.outputs.go_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag Go SDK for pkg.go.dev
        run: |
          VERSION=$(node -p "require('./sdks/go/package.json').version")
          TAG="sdks/go/v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}" || {
              echo "${TAG} exists on a different commit." >&2
              exit 1
            }
            echo "${TAG} already exists on this release; skipping."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

  publish-pypi:
    name: Publish PyPI
    needs: release
    if: ${{ needs.release.outputs.has_changesets == 'false' && needs.release.outputs.python_changed == 'true' }}
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      contents: write
      id-token: write

  publish-rust:
    name: Publish Rust SDK
    needs: release
    if: ${{ needs.release.outputs.has_changesets == 'false' && needs.release.outputs.rust_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/cloudflare-flagship
    # `id-token: write` lets crates-io-auth-action mint a short-lived crates.io token (trusted
    # publishing). No step in this job compiles code, so dependency build scripts never run
    # while that permission or the token is available.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Check crates.io
        id: crates-io
        run: |
          VERSION=$(node -p "require('./sdks/rust/package.json').version")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          # crates.io rejects requests without a descriptive User-Agent.
          crates_io_status() {
            curl --silent --show-error --retry 3 --retry-all-errors \
              --user-agent "cloudflare/flagship release (https://github.com/cloudflare/flagship)" \
              --output /dev/null --write-out '%{http_code}' "$1"
          }

          CRATE_STATUS=$(crates_io_status "https://crates.io/api/v1/crates/cloudflare-flagship")
          if [ "${CRATE_STATUS}" = "404" ]; then
            echo "cloudflare-flagship does not exist on crates.io yet, so trusted publishing cannot be configured for it." >&2
            echo "Publish ${VERSION} manually from this commit, add the trusted publisher, then re-run this job (see AGENTS.md)." >&2
            exit 1
          elif [ "${CRATE_STATUS}" != "200" ]; then
            echo "Unexpected crates.io response while checking cloudflare-flagship: ${CRATE_STATUS}" >&2
            exit 1
          fi

          VERSION_STATUS=$(crates_io_status "https://crates.io/api/v1/crates/cloudflare-flagship/${VERSION}")
          case "${VERSION_STATUS}" in
            200)
              echo "cloudflare-flagship@${VERSION} already exists on crates.io; skipping publish."
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected crates.io response while checking cloudflare-flagship@${VERSION}: ${VERSION_STATUS}" >&2
              exit 1
              ;;
          esac

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: ${{ steps.crates-io.outputs.published == 'false' }}
        id: auth

      # PR CI runs `cargo publish --dry-run`, and the release commit only bumps versions, so
      # skipping verification here avoids compiling dependencies while the token exists.
      - name: Publish crate
        if: ${{ steps.crates-io.outputs.published == 'false' }}
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify

      - name: Tag Rust SDK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sdks/rust/v${{ steps.crates-io.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}" || {
              echo "${TAG} exists on a different commit." >&2
              exit 1
            }
            echo "${TAG} already exists on this release; skipping."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" > /dev/null
          fi
