name: Publish PyPI

on:
  push:
    tags:
      - '@cloudflare/flagship-python@*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build
        working-directory: sdks/python
        run: uv build

      - name: Publish
        working-directory: sdks/python
        run: uv publish
