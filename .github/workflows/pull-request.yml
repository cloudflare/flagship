name: Pull Request

on:
  pull_request:
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Changesets ────────────────────────────────────────────────────────────

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run changeset:validate

  # ── TypeScript SDK ────────────────────────────────────────────────────────

  typescript-format:
    name: TypeScript Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  typescript-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx sherif
      - run: pnpm run lint

  typescript-build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  typescript-typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typescript-build
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck

  typescript-test:
    name: TypeScript Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typescript-build
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # ── Python SDK ────────────────────────────────────────────────────────────

  python-format:
    name: Python Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          working-directory: sdks/python

      - run: uv run ruff format --check .
        working-directory: sdks/python

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          working-directory: sdks/python

      - run: uv run ruff check .
        working-directory: sdks/python

  python-build:
    name: Python Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          working-directory: sdks/python

      - run: uv build
        working-directory: sdks/python

  python-typecheck:
    name: Python Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: python-build
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          working-directory: sdks/python

      - run: uv run --group dev mypy
        working-directory: sdks/python

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: python-build
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          working-directory: sdks/python

      - run: uv run --group dev pytest
        working-directory: sdks/python

  # ── Preview ───────────────────────────────────────────────────────────────

  preview:
    name: Publish Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - typescript-format
      - typescript-lint
      - typescript-typecheck
      - typescript-test
      - python-format
      - python-lint
      - python-typecheck
      - python-test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm dlx pkg-pr-new publish './sdks/typescript'
