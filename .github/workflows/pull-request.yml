name: Pull Request

on:
  pull_request:
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Repo-wide ─────────────────────────────────────────────────────────────

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run changeset:validate

  # ── TypeScript SDK ────────────────────────────────────────────────────────

  typescript-format:
    name: TypeScript / Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  typescript-lint:
    name: TypeScript / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sherif
      - run: pnpm run lint

  typescript-typecheck:
    name: TypeScript / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  typescript-test:
    name: TypeScript / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  typescript-build:
    name: TypeScript / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  typescript-preview:
    name: TypeScript / Publish Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typescript-build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm dlx pkg-pr-new publish './sdks/typescript'

  # ── Python SDK ────────────────────────────────────────────────────────────

  python-format:
    name: Python / Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sdks/python
      - working-directory: sdks/python
        run: uv sync --group dev --locked
      - working-directory: sdks/python
        run: uv run ruff format --check .

  python-lint:
    name: Python / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sdks/python
      - working-directory: sdks/python
        run: uv sync --group dev --locked
      - working-directory: sdks/python
        run: uv run ruff check .

  python-typecheck:
    name: Python / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sdks/python
      - working-directory: sdks/python
        run: uv sync --group dev --locked
      - working-directory: sdks/python
        run: uv run ty check

  python-test:
    name: Python / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sdks/python
      - working-directory: sdks/python
        run: uv sync --group dev --locked
      - working-directory: sdks/python
        run: uv run pytest

  python-build:
    name: Python / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sdks/python
      - working-directory: sdks/python
        run: uv build

  # ── Go SDK ────────────────────────────────────────────────────────────────

  go-format:
    name: Go / Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
      - working-directory: sdks/go
        run: test -z "$(gofmt -l .)"

  go-vet:
    name: Go / Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
      - working-directory: sdks/go
        run: go vet ./...

  go-test:
    name: Go / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
      - working-directory: sdks/go
        run: go test ./...

  # ── Rust SDK ──────────────────────────────────────────────────────────────

  rust-stable:
    name: Rust / Stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: rust-stable-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: rust-stable-${{ runner.os }}-
      - working-directory: sdks/rust
        run: cmp --silent ../../spec/local-evaluation/cases.json src/local/cases.json
      - working-directory: sdks/rust
        run: cargo fmt --check
      - working-directory: sdks/rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check TLS feature combinations
        working-directory: sdks/rust
        run: |
          cargo test --locked --no-default-features --features rustls
          cargo test --locked --no-default-features --features native-tls
          cargo test --locked --no-default-features --features rustls-no-provider
      - working-directory: sdks/rust
        run: cargo check --locked --examples --all-features
      - working-directory: sdks/rust
        run: cargo test --locked --all-features
      - working-directory: sdks/rust
        run: cargo test --locked --release --all-features
      - name: Check doctests and documentation
        working-directory: sdks/rust
        run: |
          RUSTDOCFLAGS='-D warnings' cargo test --locked --doc --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps --all-features
      - working-directory: sdks/rust
        run: cargo package --locked
      - working-directory: sdks/rust
        run: cargo publish --dry-run --locked

  rust-msrv:
    name: Rust / MSRV 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: rust-msrv-${{ runner.os }}-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: rust-msrv-${{ runner.os }}-
      - working-directory: sdks/rust
        run: cargo check --locked --all-features
      - working-directory: sdks/rust
        run: cargo test --locked --all-features

  # ── Aggregator (required status check for branch protection) ──────────────

  ci-success:
    name: CI Success
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changesets
      - typescript-format
      - typescript-lint
      - typescript-typecheck
      - typescript-test
      - typescript-build
      - typescript-preview
      - python-format
      - python-lint
      - python-typecheck
      - python-test
      - python-build
      - go-format
      - go-vet
      - go-test
      - rust-stable
      - rust-msrv
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
