name: Release

# On push to main:
#   - If there are pending changesets, opens/updates a release PR that bumps
#     versions and rewrites changelogs.
#   - If the previous commit was a merge of that release PR (no pending
#     changesets remain), publishes to npm and triggers PyPI publish.
#
# PR CI (`pull-request.yml`) is the source of truth for correctness; this
# workflow does not re-run checks. Branch protection on `main` requires
# `CI Success` to pass before merge.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Changesets
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `uv` is needed by `.github/changeset-version.ts` to refresh `uv.lock`
      # when the Python SDK version is bumped.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: sdks/python

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - id: changesets
        uses: changesets/action@v1.7.0
        with:
          version: pnpm tsx .github/changeset-version.ts
          publish: pnpm changeset publish
          title: 'chore(release): version SDK packages'
          commit: 'chore(release): version SDK packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  publish-pypi:
    name: Publish PyPI
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      contents: read
      id-token: write
